[project]
name = "med_adapt"
version = "0.1.0"
description = "Medical imaging fine-tuning pipeline for 3D volumes using 2D natural-vision ViTs"
requires-python = "~=3.12"
dependencies = [
    "einops==0.8.2",
    "gardening_tools==0.3.5",
    "lightning==2.6.5",
    "matplotlib==3.11.1",
    "nibabel==5.4.2",
    "numpy",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
    "scikit_learn==1.9.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
